spring.application.name=webshop

# PostgreSQL konekcija
spring.datasource.url=jdbc:postgresql://localhost:5432/webshop_db
spring.datasource.username=admin
spring.datasource.password=adminpassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Keycloak JWT provjera
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/webshop